<!doctype html><html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Cinzel;font-weight:700;src:url(data:font/woff2;base64,__CINZEL700__) format('woff2')}
@font-face{font-family:Cinzel;font-weight:600;src:url(data:font/woff2;base64,__CINZEL600__) format('woff2')}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
canvas{position:absolute;left:0;top:0}
</style></head><body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>
// Melting-wax kinetic type: words set like wax, then sag and drip; after the lighting, words are lit by the flame.
const FPS=30, W=1920, H=1080;
const clamp=(x,a=0,c=1)=>Math.min(c,Math.max(a,x)), prog=(t,t0,d)=>clamp((t-t0)/d);
const mix=(a,b,p)=>a+(b-a)*p, expoOut=x=>x>=1?1:1-Math.pow(2,-10*x), easeIn=x=>x*x*x;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const BG=new Image(); BG.src='assets/img_g/s14.jpg';
const MATCH=new Image(); MATCH.src='assets/img_g/s21.jpg';

// ---- a word as wax: rasterised once, then drawn in 2px columns with per-column sag + drips
function makeWord(text,size,weight=700){
  const c=document.createElement('canvas'), g=c.getContext('2d');
  g.font=`${weight} ${size}px Cinzel`; const m=g.measureText(text);
  const w=Math.ceil(m.width)+40, h=Math.ceil(size*1.25)+20;
  c.width=w; c.height=h; g.font=`${weight} ${size}px Cinzel`; g.textBaseline='alphabetic';
  // wax body: warm ivory with a soft vertical sheen
  const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#fff8ec'); gr.addColorStop(.55,'#f3e4c8'); gr.addColorStop(1,'#d9c19a');
  g.fillStyle=gr; g.fillText(text,20,size*1.02+8);
  // ink coverage per column -> where drips can start (only under real glyph stems)
  const d=g.getImageData(0,0,w,h).data, bottom=new Float32Array(w).fill(-1);
  for(let x=0;x<w;x++) for(let y=h-1;y>=0;y--){ if(d[(y*w+x)*4+3]>140){bottom[x]=y;break;} }
  const R=rng(text.length*977+size), drips=[];
  for(let k=0;k<Math.round(w/40);k++){ let x=Math.floor(R()*w), tries=0; while(bottom[x]<0&&tries++<40) x=Math.floor(R()*w);
    if(bottom[x]>=0) drips.push({x, w:5+R()*10, len:120+R()*380, delay:R()*.5, speed:.7+R()*.7}); }
  const gc=document.createElement('canvas'); gc.width=w; gc.height=h; const gg=gc.getContext('2d');
  gg.font=`${weight} ${size}px Cinzel`; const go=gg.createLinearGradient(0,0,0,h);
  go.addColorStop(0,'#fff1cc'); go.addColorStop(.45,'#ffd27a'); go.addColorStop(.8,'#e89a3c'); go.addColorStop(1,'#b8682a');
  gg.fillStyle=go; gg.fillText(text,20,size*1.02+8);
  return {c,gc,w,h,size,bottom,drips};
}
// melt amount m in [0,1]: 0 = crisp, 1 = fully slumped with long drips
function drawWax(word,cx,cy,m,alpha=1){
  const {c,w,h,size,bottom,drips}=word;
  // compose the melting word on its own canvas, then put it on screen once (one blur, one alpha)
  if(!word.sc){ word.sc=document.createElement('canvas'); word.sc.width=w; word.sc.height=h+520; }
  const sc=word.sc, g=sc.getContext('2d'); g.clearRect(0,0,sc.width,sc.height);
  const split=Math.round(h*.42), extra=new Float32Array(w), sag=size*.32*easeIn(m);
  for(let x=0;x<w;x++) extra[x]=sag*(0.6+0.4*Math.sin(x*.031+1.7));
  for(const dr of drips){ const p=clamp((m-dr.delay)/(1-dr.delay)); if(p<=0) continue;
    const L=dr.len*Math.pow(p,1.6)*dr.speed;
    for(let x=Math.max(0,Math.floor(dr.x-dr.w*2));x<Math.min(w,Math.ceil(dr.x+dr.w*2));x++){ const k=Math.exp(-Math.pow((x-dr.x)/dr.w,2)); extra[x]=Math.max(extra[x],L*k); } }
  for(let x=0;x<w;x+=2){
    g.drawImage(c,x,0,2,split,x,0,2,split);
    g.drawImage(c,x,split,2,h-split,x,split,2,h-split+extra[x]);
  }
  for(const dr of drips){ const p=clamp((m-dr.delay)/(1-dr.delay)); if(p<=.05||bottom[dr.x]<0) continue;
    const L=dr.len*Math.pow(p,1.6)*dr.speed, by=split+(bottom[dr.x]-split)*(h-split+L)/(h-split), r=dr.w*.75*(0.6+0.4*p);
    const gr=g.createRadialGradient(dr.x-r*.3,by-r*.3,0,dr.x,by,r);
    gr.addColorStop(0,'#fffaf0'); gr.addColorStop(.6,'#ecdcbc'); gr.addColorStop(1,'rgba(217,193,154,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(dr.x,by,r,0,Math.PI*2); g.fill(); }
  const x0=Math.round(cx-w/2), y0=Math.round(cy-h/2+size*.25*easeIn(m));
  ctx.save(); ctx.globalAlpha=alpha;
  if(m>.15) ctx.filter=`blur(${(1.6*easeIn((m-.15)/.85)).toFixed(2)}px)`;
  ctx.drawImage(sc,x0,y0); ctx.restore(); ctx.filter='none';
}
// lit word: same glyphs, gilded by the flame, glow breathing with the flicker
function drawLit(word,cx,cy,p,flick){
  const {w,h}=word, x0=Math.round(cx-w/2), y0=Math.round(cy-h/2);
  ctx.save();
  ctx.globalAlpha=expoOut(p);
  ctx.shadowColor=`rgba(255,170,70,${0.55+0.15*flick})`; ctx.shadowBlur=38+8*flick;
  // light spreads from the centre outwards
  const r=expoOut(p)*w*.75;
  ctx.beginPath(); ctx.ellipse(cx,cy,Math.max(1,r),h,0,0,Math.PI*2); ctx.clip();
  ctx.drawImage(word.gc,x0,y0); ctx.shadowBlur=0; ctx.globalAlpha*=0.25+0.1*flick; ctx.globalCompositeOperation='lighter'; ctx.drawImage(word.gc,x0,y0); ctx.restore();
}

let ready=false; const W1={}, wordsSpec={dark:["L'OBSCURITÉ",150],ashes:['TOUT A BRÛLÉ',118],light:['LA LUMIÈRE',160]};
Promise.all([document.fonts.load('700 150px Cinzel'),document.fonts.load('600 150px Cinzel')]).then(()=>{ for(const k in wordsSpec) W1[k]=makeWord(...wordsSpec[k]); ready=true; });
window.ready=()=>ready&&BG.complete&&MATCH.complete;

window.seek=function(t){
  t=Math.round(t*FPS)/FPS; ctx.filter='none';
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  if(t<5.2){
    // burning car behind, sinking into darkness while the words melt
    const dim=0.55-0.45*prog(t,0,5);
    ctx.globalAlpha=dim; ctx.drawImage(BG,-192,-108,2304,1296); ctx.globalAlpha=1;
    const v=ctx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.9); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.85)'); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
    const a1=expoOut(prog(t,0.2,0.5));
    if(t<2.7) drawWax(W1.ashes,W/2,H/2-20,easeIn(prog(t,0.9,1.8))*0.85,a1*(1-prog(t,2.45,0.25)));
    if(t>=2.7) drawWax(W1.dark,W/2,H/2-20,prog(t,3.2,2.0),expoOut(prog(t,2.7,.35))*(1-prog(t,5.0,.2)));
  } else if(t<6.4){
    // hard black, then the match flares
    const f=prog(t,5.6,0.8);
    if(f>0){ ctx.globalAlpha=expoOut(f); ctx.drawImage(MATCH,-192,-108,2304,1296); ctx.globalAlpha=1; }
  } else {
    const flick=Math.sin(t*19.3)*.5+Math.sin(t*31.7+1)*.3+Math.sin(t*7.1)*.2;
    ctx.globalAlpha=0.55; ctx.drawImage(MATCH,-192-60*prog(t,6.4,3),-108,2304*1.04,1296*1.04); ctx.globalAlpha=1;
    const v=ctx.createRadialGradient(W*.55,H*.5,H*.1,W/2,H/2,H); v.addColorStop(0,'rgba(0,0,0,.15)'); v.addColorStop(1,'rgba(0,0,0,.8)'); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
    drawLit(W1.light,W/2,H/2+250,prog(t,6.6,1.2),flick);
  }
};
</script></body></html>
